
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Bristol Community Events</title>
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>
<body class="welcome">
<div class="welcome-page-wrap">

    <header class="shared-site-header">
        <div class="logo-badge">BCE</div>
        <h1 class="main-title">Bristol Community Events</h1>
        <div class="user-area">
            <a href="{{ url_for('home') }}" class="login-btn">Home</a>
        </div>
    </header>

    <div class="signup-container">
        <h2>Create your account</h2>
        <p>Join Bristol Community Events to book tickets and stay updated on all upcoming events!</p>
        {% if message %}
            <p class="form-msg form-msg--success">{{ message }}</p>
        {% endif %}
        <form method="POST" action="{{ url_for('signup') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Sign Up</button>
        </form>
        <div class="login-link">
            Already have an account? <a href="{{ url_for('login') }}">Log in</a>
        </div>
    </div>

    <footer class="welcome-footer">
        <p><a href="{{ url_for('privacy') }}">Privacy Policy</a> | © 2024 Bristol Community Events</p>
    </footer>
</div>
</body>
</html>
